spring:
  application.name: studio
  config.import: optional:configtree:/etc/secrets/      # KT 전용 Secret — 🔴 AWS 서비스들의 app-secrets 를 마운트하지 않습니다

  datasource:
    # 시각은 전부 UTC 로 저장합니다 (DATETIME(3))
    url: jdbc:mysql://${DB_HOST}:3306/studio?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true&characterEncoding=UTF-8
    username: studio_app
    password: ${db.password}                  # ← configtree 파일
    hikari:
      maximum-pool-size: 5                    # 관리자는 동시에 한 자릿수
      minimum-idle: 1
      connection-timeout: 3000

  data:
    redis:                                    # 로그인 2단계 대기 · 세션 (KT 의 Redis · 같은 compose)
      host: ${REDIS_HOST}
      port: 6379
      password: ${redis.password}             # ← configtree 파일
      timeout: 2s
      repositories.enabled: false             # @RedisHash 저장소는 쓰지 않습니다 (StringRedisTemplate 만)

  mail:                                       # 로그인 인증 코드 메일 — Gmail SMTP (앱 비밀번호). 보내는 주소는 app.login.mail-from
    host: ${SMTP_HOST:smtp.gmail.com}
    port: ${SMTP_PORT:587}
    username: ${smtp.username:}               # ← configtree 파일 (Gmail 주소)
    password: ${smtp.password:}               # ← configtree 파일 (앱 비밀번호 16자)
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate              # Flyway 와 엔티티가 어긋나면 기동 실패
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

  servlet:
    multipart:
      max-file-size: 10MB                     # 무대 도면 사진 (app.gpu.max-image-bytes 와 같은 값)
      max-request-size: 12MB

server:
  port: 8085
  shutdown: graceful

management:
  server.port: 8095
  endpoints.web.exposure.include: health,info,prometheus
  health.mail.enabled: false                  # health 를 볼 때마다 SMTP 에 붙지 않게
  endpoint.health:
    probes.enabled: true
    group:
      readiness.include: db,redis
      liveness.include: ping

app:
  session:
    ttl-hours: 8                              # 로그인 후 최대 8시간 (업무일 단위)
    idle-minutes: 30                          # 30분 동안 요청이 없으면 만료
    cookie-secure: true
    cookie-same-site: ${STUDIO_COOKIE_SAMESITE:Strict}   # 관리자 화면이 다른 사이트(도메인)에 있으면 None
  login:
    challenge-minutes: 5                      # 1차(아이디 · 비밀번호) 통과 후 메일 인증 코드 입력까지
    max-failures: 5                           # 비밀번호 · 인증 코드 연속 실패
    lock-minutes: 15
    bcrypt-strength: 12
    mail-from: ${STUDIO_MAIL_FROM:indig <noreply@indig.co.kr>}   # Gmail "다른 주소에서 메일 보내기"에 등록한 주소여야 그대로 나갑니다
  # 들어오는 크롤러 호출(/internal/crawl/**)의 키는 configtree crawler.shared-secret — 없으면 그 경로만 401 (CrawlerTokenFilter)
  internal-token:                             # 나가는 호출 (Studio → Concert · Catalog · Member · Payment)
    issuer: studio
    ttl-seconds: 300
  services:                                   # AWS · 온프레미스 서비스 — KT 에서 Cloudflare 관리자 터널(link-aws · link-onprem.indig.co.kr)을 건너갑니다 · 운영은 4개가 같은 주소 (manifests services/studio)
    concert: ${CONCERT_BASE_URL:http://concert:8083}
    catalog: ${CATALOG_BASE_URL:http://catalog:8082}
    member: ${MEMBER_BASE_URL:http://member:8081}
    payment: ${PAYMENT_BASE_URL:http://payment:8084}
    connect-timeout-ms: 2000
    read-timeout-ms: 10000                    # 터널 + 좌석 수천 건 저장
  gpu:                                        # 무대 그리기 검증 서버 (개인 GPU 서버 · WireGuard 피어) — 토큰은 configtree gpu.token
    base-url: ${GPU_BASE_URL:}
    connect-timeout-ms: 3000
    read-timeout-ms: 180000                   # 분석이 느려도 기다립니다 (백그라운드 작업)
    max-image-bytes: 10485760
  cors:
    allowed-origins: ${STUDIO_ALLOWED_ORIGINS:}          # 관리자 화면 출처 (쉼표 구분). 같은 출처면 비워 둡니다
