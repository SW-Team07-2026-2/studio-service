# 로컬 MySQL · Redis · 메일함 — 운영(KT)과 같은 8.4 · 7.4. 다른 서비스의 PostgreSQL(5432) · Redis(6379~6381)와 겹치지 않게 3307 · 6382 로 엽니다
# docker compose -f local/compose.yml up -d
services:
  studio-mysql:
    image: mysql:8.4
    ports: ["127.0.0.1:3307:3306"]
    environment:
      MYSQL_DATABASE: studio
      MYSQL_USER: studio_app
      MYSQL_PASSWORD: studio-local-pw          # 로컬 전용 — local/setup-local.sh 가 같은 값을 local-secrets/db.password 에 씁니다
      MYSQL_ROOT_PASSWORD: studio-local-root
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_0900_ai_ci"]
    volumes: ["studio-mysql:/var/lib/mysql"]
  studio-redis:                                # 로그인 2단계 대기 · 세션 — 디스크에 쓰지 않음
    image: redis:7.4-alpine
    ports: ["127.0.0.1:6382:6379"]
    command: ["redis-server", "--requirepass", "studio-local-redis", "--save", "", "--appendonly", "no"]   # local/setup-local.sh 의 redis.password 와 같은 값
  studio-mail:                                 # 로그인 인증 코드 메일을 받는 가짜 SMTP — 화면 http://localhost:8025 (밖으로 보내지 않음)
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]
  studio-s3:                                   # 이미지 버킷 대신 (LocalStack S3) — 버킷 indig-images-local · 이미지는 http://localhost:4566/indig-images-local/... 로 보임
    image: localstack/localstack:3.8.1
    ports: ["127.0.0.1:4566:4566"]
    environment:
      SERVICES: s3
    volumes: ["./localstack-init.sh:/etc/localstack/init/ready.d/init-s3.sh:ro"]
volumes:
  studio-mysql:
