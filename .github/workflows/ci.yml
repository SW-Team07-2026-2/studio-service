# 빌드 · 테스트 (MySQL 8.4 는 Testcontainers 가 띄웁니다).
# TODO(KT): 이미지 push · 매니페스트 태그 커밋(deploy 잡)은 KT 레지스트리와 manifests 의 services/studio 가 정해지면 추가합니다 — docs/v2_studio_service_re.md 12장
name: ci
on:
  push: { branches: [main, develop] }
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21' }
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew test --no-daemon
